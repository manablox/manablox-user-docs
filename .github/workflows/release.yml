name: Release

# Publishing is deliberate, not a side effect of a push: the release runs when someone asks
# for it, after the CMS release has put `@manablox/docs-theme` on npmjs.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build the image, but push nothing'
        type: boolean
        default: true
      latest:
        description: 'Also move the latest tag'
        type: boolean
        default: true

permissions:
  contents: read
  # The image goes to the GitHub Container Registry.
  packages: write

jobs:
  # ghcr.io/manablox/user-docs at the version of package.json, the guide on docs.manablox.io.
  image:
    name: image - user-docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: version
        run: echo "version=$(node -p 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        if: ${{ !inputs.dry-run }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/user-docs
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.version.outputs.version }}
            type=raw,value=latest,enable=${{ inputs.latest }}

      # The site's origin is docs.manablox.io (astro.config.mjs); the repository variable
      # USER_DOCS_URL builds an image for another one.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: ${{ !inputs.dry-run }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          build-args: |
            DOCS_SITE_URL=${{ vars.USER_DOCS_URL }}
          cache-from: type=gha,scope=user-docs
